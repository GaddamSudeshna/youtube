<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Position Example</title>
  <style>
    .relative-box {
      position: relative;
      background-color: #ff9800;
      padding: 40px;
      margin: 20px;
    }
    .absolute-box {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: #f44336;
      color: white;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h1>Positioning Example</h1>
  <div class="relative-box">
    Relative Box
    <div class="absolute-box">Absolute inside relative</div>
  </div>
</body>
</html>
